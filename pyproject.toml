[build-system]
requires = ["setuptools>=61.0", "wheel", "cmake>=3.16", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "pptkx"
version = "0.1.2"
description = "A Python package for 3D point cloud visualization and processing with native Wayland support."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "HERE Europe B.V." },
    { name = "Bryan Salazar" }
]
requires-python = ">=3.8"
dependencies = [
    "numpy",
]

[project.urls]
Homepage = "https://github.com/bryxnsal/pptkx"
Repository = "https://github.com/bryxnsal/pptkx"
