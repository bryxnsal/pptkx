name: Build Wheels and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_linux:
    name: Build Linux Wheel (${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            qtbase5-dev qtwayland5 libtbb-dev libeigen3-dev libgl1-mesa-dev

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install wheel setuptools build numpy

      - name: Build wheel
        run: |
          python -m build --wheel

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.python-version }}
          path: dist/*.whl

  build_windows:
    name: Build Windows Wheel (${{ matrix.python-version }})
    runs-on: windows-2022
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt 5.15
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Install vcpkg dependencies (oneTBB, Eigen3)
        run: |
          vcpkg install tbb:x64-windows eigen3:x64-windows

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install wheel setuptools build numpy

      - name: Build wheel
        env:
          CMAKE_TOOLCHAIN_FILE: C:/vcpkg/scripts/buildsystems/vcpkg.cmake
        run: |
          python -m build --wheel

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.python-version }}
          path: dist/*.whl

  release:
    name: Create GitHub Release
    needs: [build_linux, build_windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist-merged
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "pptkx v0.1.2"
          body: |
            ## pptkx v0.1.2

            High-performance 3D point cloud processing and viewer with native Wayland and Windows support.

            ### Highlights
            - 100% native Wayland support using QOffscreenSurface and system Qt5
            - Zero Wayland mouse V-Sync lag (swapInterval=0)
            - OpenGL CompatibilityProfile and HiDPI devicePixelRatio scaling
            - oneTBB task_group multithreading for fast KD-Tree operations
            - NumPy 2.x and NumPy 1.x backwards compatibility
            - Python 3.8 to 3.12+ support across Linux and Windows
            - Automated PEP 517 packaging compatible with uv and pip

            ### Installation
            Download the appropriate `.whl` file below for your operating system and Python version, then run:
            ```bash
            pip install <wheel_file>.whl
            # or with uv:
            uv pip install <wheel_file>.whl
            ```
          files: dist-merged/*.whl
